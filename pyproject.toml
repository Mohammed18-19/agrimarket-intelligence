[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrimarket-intelligence"
version = "0.1.0"
description = "Agricultural production and climate intelligence for Morocco"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "flask>=3.1,<4.0",
    "streamlit>=1.40,<2.0",
    "plotly>=5.24,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
